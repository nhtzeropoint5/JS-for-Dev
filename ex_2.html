<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

 <h2>button example</h2>

 <button onclick="document.getElementById('myImage').src='./images/my-an.png'">Image animation</button>

    <img  id="myImage" src="./images/my.jpg" alt="" height="400px" width="350px">

    <button onclick="document.getElementById('myImage').src='images/my.jpg'">image original</button>
 </button>

 <p id="demo">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Animi, minima.
 </p>

<button onclick="getElementById('demo').style.fontSize='35px'">font change</button>
<button onclick="getElementById('demo').style.fontSize='16px'">Small font</button>
<button onclick="getElementById('demo').style.display='none'">Invisible font</button>
<button onclick="getElementById('demo').style.display='block'">Visible</button>
  <script src="script.js"></script>
</body>
